# Kafei Gate relay: TCP passthrough on 443, TLS is NOT terminated here.
# Installed at /etc/nginx/nginx.conf on the kafei-gate-relay droplet.
include /etc/nginx/modules-enabled/*.conf;

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format relay '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                     'upstream=$upstream_addr status=$status '
                     'in=$bytes_received out=$bytes_sent '
                     'connect=$upstream_connect_time total=$session_time';
    access_log /var/log/nginx/relay.log relay;

    # The Gate drops the odd TCP connect (Alibaba Cloud side). Listing it three
    # times lets proxy_next_upstream retry a failed connect. Safe: nothing has
    # reached the Gate before connect succeeds, so no request is ever sent twice.
    # max_fails=0 so a dropped connect never marks the Gate down.
    upstream cofeplus_gate {
        server 8.153.75.138:443 max_fails=0;
        server 8.153.75.138:443 max_fails=0;
        server 8.153.75.138:443 max_fails=0;
    }

    # Fixed upstream. Unknown SNI goes to a local port that closes at once.
    map $ssl_preread_server_name $gate_upstream {
        service-gate.cofeplus.com cofeplus_gate;
        default                   127.0.0.1:9443;
    }

    limit_conn_zone $binary_remote_addr zone=perip:1m;

    server {
        listen 443;
        ssl_preread on;
        limit_conn perip 30;
        # 3 connect tries of 2s each, inside the app's 10s request timeout.
        # Normal connects take 0.3s to 1.4s.
        proxy_connect_timeout 2s;
        proxy_next_upstream on;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 7s;
        proxy_timeout 90s;
        proxy_pass $gate_upstream;
    }

    server {
        listen 127.0.0.1:9443;
        access_log off;
        return '';
    }
}
